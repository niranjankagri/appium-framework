# Runs the Android suite on an emulator for every push and pull request.
# The HTML report, the screenshots and screen recordings of failed tests and the
# Appium server log are kept as a downloadable artifact of each run.
name: Tests

on:
  push:
  pull_request:
  # Manual run from the Actions tab; can also run the known-bug suite
  workflow_dispatch:
    inputs:
      suite:
        description: TestNG suite file
        type: choice
        options: [testng.xml, known-bugs.xml]
        default: testng.xml

jobs:
  android:
    name: Android 15 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUITE: ${{ inputs.suite || 'testng.xml' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Same versions as docs/setup.md, so CI and a local machine behave alike
      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@3.8.0
          appium driver install uiautomator2@8.7.0

      - name: Download the app under test
        run: bash scripts/get-app.sh

      # Compile before the emulator starts, so emulator time is spent on tests only
      - name: Compile
        run: mvn -B -q test-compile

      # Hardware acceleration for the x86_64 emulator on the Linux runner
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Keeps running for the rest of the job; the tests connect to it on port 4723
      - name: Start the Appium server
        run: |
          appium --log-level warn --log appium.log &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:4723/status

      - name: Run the tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          # Fewer moving parts: animations off, no window, audio or camera
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: mvn -B test -DsuiteXmlFile=${{ env.SUITE }}

      # Totals from TestNG's own results file into the run's summary page
      - name: Summary
        if: always()
        run: |
          f=target/surefire-reports/testng-results.xml
          if [ -f "$f" ]; then
            line=$(grep -o '<testng-results[^>]*>' "$f")
            get() { echo "$line" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*'; }
            {
              echo "### Appium Android suite: \`$SUITE\`"
              echo ""
              echo "| Total | Passed | Failed | Skipped |"
              echo "|---|---|---|---|"
              echo "| $(get total) | $(get passed) | $(get failed) | $(get skipped) |"
              echo ""
              echo "HTML report with screenshots and screen recordings: artifact **appium-report**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Kept even when tests fail, so failures can be analysed
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-report
          path: |
            target/surefire-reports/appium-test-report.html
            target/artifacts/
            appium.log
          if-no-files-found: ignore
