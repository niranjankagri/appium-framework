# Test settings. Any key can be overridden on the command line, e.g.
#   mvn test -DdeviceName=emulator-5556 -DappiumUrl=http://127.0.0.1:4724

# Appium server started with: appium (default port 4723)
appiumUrl=http://127.0.0.1:4723

# Device: the emulator created in the setup (see README); udid is optional
platformVersion=15
deviceName=Pixel_API_35
udid=

# App under test: Sauce Labs My Demo App, downloaded by scripts/get-app
app=apps/mda-2.3.0-27.apk
appPackage=com.saucelabs.mydemoapp.android
appActivity=com.saucelabs.mydemoapp.android.view.activities.SplashActivity

# Seconds to wait for an element before failing
explicitWait=10
# Seconds Appium keeps an idle session open (protects against hung runs)
newCommandTimeout=120
